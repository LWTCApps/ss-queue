let previewStore = { tickets: [] };

function previewCall(action, payload) {
  if (action === "getState") return { tickets: previewStore.tickets };
  if (action === "checkin") {
    const count = previewStore.tickets.filter((t) => t.service === payload.service).length + 1;
    const number = `${payload.service}-${String(count).padStart(3, "0")}`;
    const ticket = {
      id: `local-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      number, service: payload.service, name: payload.name, studentId: payload.studentId || "",
      studentType: payload.studentType || "",
      programInquiry: payload.programInquiry || "",
      programEnrolled: payload.programEnrolled || "",
      workforceAdvisor: payload.workforceAdvisor || "",
      status: "waiting", window: null, checkinTime: new Date().toISOString(), calledTime: null,
    };
    previewStore = { tickets: [...previewStore.tickets, ticket] };
    return { tickets: previewStore.tickets, createdId: ticket.id };
  }
  if (action === "setStatus") {
    previewStore = {
      tickets: previewStore.tickets.map((t) => t.id === payload.id
        ? { ...t, status: payload.status, window: payload.window ?? t.window,
            calledTime: payload.status === "called" ? new Date().toISOString() : t.calledTime }
        : t)
    };
    return { tickets: previewStore.tickets };
  }
  if (action === "reset") {
    previewStore = { tickets: [] };
    return { tickets: [] };
  }
  return { tickets: previewStore.tickets };
}

async function callFlow(action, payload = {}) {
  if (!FLOW_URL) throw new Error("no-flow-url");
  const res = await fetch(FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...payload }),
  });
  if (!res.ok) throw new Error(`flow-http-${res.status}`);
  return res.json();
}

async function backend(action, payload) {
  try {
    const data = await callFlow(action, payload);
    return { data, connected: true };
  } catch (e) {
    return { data: previewCall(action, payload), connected: false };
  }
}

// ---------- Student View ----------

function StudentView({ onBack }) {
  const [tickets, setTickets] = useState([]);
  const [connected, setConnected] = useState(true);
  const [name, setName] = useState("");
  const [studentId, setStudentId] = useState("");
  const [studentType, setStudentType] = useState(null);
  const [programInquiry, setProgramInquiry] = useState("");
  const [programEnrolled, setProgramEnrolled] = useState("");
  const [advisorChoice, setAdvisorChoice] = useState("");
  const [advisorOther, setAdvisorOther] = useState("");
  const [service, setService] = useState(SERVICES[0].code);
  const [myTicketId, setMyTicketId] = useState(null);
  const [error, setError] = useState("");

  const refresh = useCallback(async () => {
    const { data, connected } = await backend("getState");
    setTickets(data.tickets || []);
    setConnected(connected);
  }, []);

  useEffect(() => {
    refresh();
    const iv = setInterval(refresh, 4000);
    return () => clearInterval(iv);
  }, [refresh]);

  const myTicket = tickets.find((t) => t.id === myTicketId) || null;

  const checkIn = async () => {
    if (!name.trim()) { setError("Please enter your name."); return; }
    if (!studentType) { setError("Please let us know if you're a new or returning student."); return; }
    setError("");
    const workforceAdvisor = advisorChoice === ADVISOR_OTHER_VALUE ? advisorOther.trim() : advisorChoice;
    const { data, connected } = await backend("checkin", {
      service, name: name.trim(), studentId: studentId.trim(), studentType,
      programInquiry: studentType === "New" ? programInquiry : "",
      programEnrolled: studentType === "Returning" ? programEnrolled : "",
      workforceAdvisor,
    });
    setTickets(data.tickets || []);
    setConnected(connected);
    setMyTicketId(data.createdId);
  };

  const cancelTicket = async () => {
    const { data, connected } = await backend("setStatus", { id: myTicketId, status: "cancelled" });
    setTickets(data.tickets || []);
    setConnected(connected);
    setMyTicketId(null);
    setName(""); setStudentId(""); setStudentType(null);
    setProgramInquiry(""); setProgramEnrolled(""); setAdvisorChoice(""); setAdvisorOther("");
  };

  const position = myTicket && myTicket.status === "waiting"
    ? tickets.filter((t) => (t.status === "waiting" || t.status === "called") && new Date(t.checkinTime) <= new Date(myTicket.checkinTime)).length
    : null;

  return (
    <div style={{ minHeight: "100vh", background: THEME.bg, display: "flex", flexDirection: "column" }}>
      <GlobalStyle />
      <PageHeader onHome={onBack} right={
        <span style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 600, fontSize: 13, color: THEME.slate, letterSpacing: 0.3 }}>Student Services Queue</span>
      } />
      <div style={{ flex: 1, padding: "24px 16px 20px" }}>
        <div style={{ maxWidth: 480, margin: "0 auto" }}>
          <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: THEME.slate, fontFamily: "'Inter', sans-serif", fontSize: 13, cursor: "pointer", marginBottom: 18, padding: 0 }}>
            <IconArrowLeft size={15} /> Back
          </button>
          <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, letterSpacing: 2, color: THEME.primaryDark, textTransform: "uppercase", marginBottom: 12 }}>Student Check-In</div>
          <ConnectionBanner connected={connected} />
          {!myTicket || myTicket.status === "cancelled" ? (
            <Panel style={{ padding: 22 }}>
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Full name</div>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Jordan Alvarez"
                style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14 }} />
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Are you a new or returning student?</div>
              <select value={studentType || ""} onChange={(e) => setStudentType(e.target.value || null)}
                style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14 }}>
                <option value="" disabled>Select one…</option>
                <option value="New">New Student</option>
                <option value="Returning">Returning Student</option>
              </select>

              {studentType === "New" && (
                <React.Fragment>
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Which program are you interested in?</div>
                  <select value={programInquiry} onChange={(e) => setProgramInquiry(e.target.value)}
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14 }}>
                    <option value="">Not sure yet</option>
                    {PROGRAMS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </React.Fragment>
              )}

              {studentType === "Returning" && (
                <React.Fragment>
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Student ID (optional)</div>
                  <input value={studentId} onChange={(e) => setStudentId(e.target.value)} placeholder="S00123456"
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14 }} />
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Which program are you enrolled in / accepted into?</div>
                  <select value={programEnrolled} onChange={(e) => setProgramEnrolled(e.target.value)}
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14 }}>
                    <option value="">Select a program…</option>
                    {PROGRAMS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </React.Fragment>
              )}

              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 6 }}>Workforce Advisor (if you have one)</div>
              <select value={advisorChoice} onChange={(e) => setAdvisorChoice(e.target.value)}
                style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: advisorChoice === ADVISOR_OTHER_VALUE ? 10 : 16 }}>
                <option value="">I don't know / not applicable</option>
                {ADVISORS.map((a) => <option key={a} value={a}>{a}</option>)}
                <option value={ADVISOR_OTHER_VALUE}>Other — type name</option>
              </select>
              {advisorChoice === ADVISOR_OTHER_VALUE && (
                <input value={advisorOther} onChange={(e) => setAdvisorOther(e.target.value)} placeholder="Advisor's name"
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 16 }} />
              )}

              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 8 }}>What do you need help with?</div>

              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, fontWeight: 700, color: THEME.orange, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Financial Aid</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8, marginBottom: 16 }}>
                {SERVICES.filter((s) => s.queue === "financial-aid").map((s) => (
                  <button key={s.code} onClick={() => setService(s.code)} style={{
                    display: "flex", alignItems: "center", gap: 8, padding: "10px 10px", borderRadius: 8, cursor: "pointer",
                    background: service === s.code ? "#E6F7FD" : THEME.bg,
                    border: `1px solid ${service === s.code ? THEME.primary : THEME.border}`,
                    color: service === s.code ? THEME.primaryDark : THEME.ink, textAlign: "left"
                  }}>
                    <s.Icon size={15} />
                    <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5 }}>{s.label}</span>
                  </button>
                ))}
              </div>

              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, fontWeight: 700, color: THEME.primaryDark, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Student Services</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 18 }}>
                {SERVICES.filter((s) => s.queue === "student-services").map((s) => (
                  <button key={s.code} onClick={() => setService(s.code)} style={{
                    display: "flex", alignItems: "center", gap: 8, padding: "10px 10px", borderRadius: 8, cursor: "pointer",
                    background: service === s.code ? "#E6F7FD" : THEME.bg,
                    border: `1px solid ${service === s.code ? THEME.primary : THEME.border}`,
                    color: service === s.code ? THEME.primaryDark : THEME.ink, textAlign: "left"
                  }}>
                    <s.Icon size={15} />
                    <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5 }}>{s.label}</span>
                  </button>
                ))}
              </div>
              {error && <div style={{ color: THEME.red, fontFamily: "'Inter', sans-serif", fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
              <button onClick={checkIn} className="ssq-btn-primary" style={{ width: "100%", background: THEME.primary, color: "#fff", border: "none", borderRadius: 999, padding: "12px 0", fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                Get in line <IconChevronRight size={16} />
              </button>
            </Panel>
          ) : (
            <Panel style={{ padding: 26, textAlign: "center" }}>
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>Your number</div>
              <FlapNumber value={myTicket.number} size={52} />
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: THEME.ink, marginTop: 12 }}>
                {serviceInfo(myTicket.service).label}
                {myTicket.studentType && <span style={{ color: THEME.slateDim }}> · {myTicket.studentType} Student</span>}
              </div>
              {myTicket.status === "waiting" && (
                <div style={{ marginTop: 22, borderTop: `1px solid ${THEME.border}`, paddingTop: 18, display: "flex", justifyContent: "space-around" }}>
                  <div>
                    <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 22, color: THEME.primaryDark, fontWeight: 800 }}>{position}</div>
                    <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slate, marginTop: 2 }}>in line</div>
                  </div>
                  <div>
                    <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 22, color: THEME.primaryDark, fontWeight: 800 }}>~{position * AVG_MINUTES}m</div>
                    <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slate, marginTop: 2 }}>estimated wait</div>
                  </div>
                </div>
              )}
              {myTicket.status === "called" && (
                <div style={{ marginTop: 18, background: "#FDF1E7", border: `1px solid ${THEME.orange}`, borderRadius: 8, padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                  <IconBell size={15} color={THEME.orange} />
                  <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#9A4A10", fontWeight: 600 }}>You're being called by {myTicket.window} — head to the front desk</span>
                </div>
              )}
              {myTicket.status === "serving" && (
                <div style={{ marginTop: 18, background: "#EFF7E3", border: `1px solid ${THEME.green}`, borderRadius: 8, padding: "12px 14px" }}>
                  <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: THEME.greenDark, fontWeight: 600 }}>Currently being helped by {myTicket.window}</span>
                </div>
              )}
              {myTicket.status === "completed" && (
                <div style={{ marginTop: 18, fontFamily: "'Inter', sans-serif", fontSize: 13, color: THEME.slate }}>You've been helped. Thanks for stopping by!</div>
              )}
              {(myTicket.status === "waiting" || myTicket.status === "called") && (
                <button onClick={cancelTicket} style={{ marginTop: 20, background: "none", border: `1px solid ${THEME.border}`, color: THEME.slate, borderRadius: 999, padding: "9px 16px", fontFamily: "'Inter', sans-serif", fontSize: 12.5, cursor: "pointer" }}>
                  Cancel my ticket
                </button>
              )}
            </Panel>
          )}
          <div style={{ marginTop: 20 }}><NowServingBoard tickets={tickets} /></div>
        </div>
      </div>
      <PageFooter />
    </div>
  );
}

      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <Panel style={{ padding: 28, width: 300 }}>
          <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: THEME.slate, fontFamily: "'Inter', sans-serif", fontSize: 13, cursor: "pointer", marginBottom: 18, padding: 0 }}>
            <IconArrowLeft size={15} /> Back
          </button>
          <IconLock size={20} color={THEME.primaryDark} />

          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slateDim, marginTop: 4, marginBottom: 16 }}>Enter your staff PIN to continue.</div>

            placeholder="****"
            style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px", color: THEME.ink, fontFamily: "'Poppins', sans-serif", fontSize: 16, letterSpacing: 4 }} />
          {err && <div style={{ color: THEME.red, fontFamily: "'Inter', sans-serif", fontSize: 12, marginTop: 8 }}>{err}</div>}
          <button onClick={() => pin === STAFF_PIN ? onSuccess() : setErr("Incorrect PIN.")} className="ssq-btn-primary" style={{ width: "100%", marginTop: 14, background: THEME.primary, color: "#fff", border: "none", borderRadius: 999, padding: "10px 0", fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
            Sign in
          </button>
        </Panel>
      </div>
      <PageFooter />
    </div>
  );
}

function StaffConsole({ onExit }) {
  const [tickets, setTickets] = useState([]);
  const [connected, setConnected] = useState(true);
  const [windowChoice, setWindowChoice] = useState("");
  const [windowOther, setWindowOther] = useState("");
  const windowNum = windowChoice === ADVISOR_OTHER_VALUE ? windowOther.trim() : windowChoice;
  const [walkName, setWalkName] = useState("");
  const [walkService, setWalkService] = useState(SERVICES[0].code);
  const [walkStudentType, setWalkStudentType] = useState("New");
  const [walkProgramInquiry, setWalkProgramInquiry] = useState("");
  const [walkProgramEnrolled, setWalkProgramEnrolled] = useState("");
  const [walkAdvisorChoice, setWalkAdvisorChoice] = useState("");
  const [walkAdvisorOther, setWalkAdvisorOther] = useState("");
  const [queueFilter, setQueueFilter] = useState("all");

  const refresh = useCallback(async () => {
    const { data, connected } = await backend("getState");
    setTickets(data.tickets || []);
    setConnected(connected);
  }, []);

  useEffect(() => {
    refresh();
    const iv = setInterval(refresh, 4000);
    return () => clearInterval(iv);
  }, [refresh]);

  const inQueue = (t) => queueFilter === "all" || serviceInfo(t.service).queue === queueFilter;
  const queueFilteredTickets = tickets.filter(inQueue);

  const waiting = tickets.filter((t) => t.status === "waiting" && inQueue(t)).sort((a, b) => new Date(a.checkinTime) - new Date(b.checkinTime));
  const inProgress = tickets.filter((t) => (t.status === "called" || t.status === "serving") && inQueue(t)).sort((a, b) => new Date(a.calledTime) - new Date(b.calledTime));

  const callStudent = async (id) => {
    if (!windowNum.trim()) return;
    const { data, connected } = await backend("setStatus", { id, status: "called", window: windowNum });
    setTickets(data.tickets || []);
    setConnected(connected);
  };
  const callNext = async () => {
    if (waiting.length === 0 || !windowNum.trim()) return;
    callStudent(waiting[0].id);
  };
  const setStatus = async (id, status) => {
    const { data, connected } = await backend("setStatus", { id, status });
    setTickets(data.tickets || []);
    setConnected(connected);
  };
  const addWalkIn = async () => {
    if (!walkName.trim()) return;
    const workforceAdvisor = walkAdvisorChoice === ADVISOR_OTHER_VALUE ? walkAdvisorOther.trim() : walkAdvisorChoice;
    const { data, connected } = await backend("checkin", {
      service: walkService, name: walkName.trim(), studentId: "", studentType: walkStudentType,
      programInquiry: walkStudentType === "New" ? walkProgramInquiry : "",
      programEnrolled: walkStudentType === "Returning" ? walkProgramEnrolled : "",
      workforceAdvisor,
    });
    setTickets(data.tickets || []);
    setConnected(connected);
    setWalkName(""); setWalkProgramInquiry(""); setWalkProgramEnrolled(""); setWalkAdvisorChoice(""); setWalkAdvisorOther("");
  };
  const resetDay = async () => {
    if (!window.confirm("Clear today's entire queue? This can't be undone.")) return;
    const { data, connected } = await backend("reset");
    setTickets(data.tickets || []);
    setConnected(connected);
  };
  const exportCsv = () => {
    const rows = [["Number", "Name", "Student ID", "Student Type", "Service", "Program Inquiry", "Program Enrolled", "Workforce Advisor", "Status", "Checked In", "Called", "Representative"]];
    tickets.forEach((t) => { rows.push([t.number, t.name, t.studentId, t.studentType || "", serviceInfo(t.service).label, t.programInquiry || "", t.programEnrolled || "", t.workforceAdvisor || "", t.status, t.checkinTime, t.calledTime || "", t.window || ""]); });
    const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `student-services-queue-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{ minHeight: "100vh", background: THEME.bg, display: "flex", flexDirection: "column" }}>
      <GlobalStyle />
      <PageHeader onHome={onExit} right={
        <button onClick={onExit} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: THEME.slate, fontFamily: "'Inter', sans-serif", fontSize: 12.5, cursor: "pointer", padding: 0 }}>
          <IconLogOut size={14} /> Exit console
        </button>
      } />
      <div style={{ flex: 1, padding: "22px 16px 20px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
            <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, letterSpacing: 2, color: THEME.primaryDark, textTransform: "uppercase" }}>Staff Console</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={refresh} style={{ display: "flex", alignItems: "center", gap: 6, background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.slate, borderRadius: 8, padding: "7px 12px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}>
                <IconRefresh size={13} /> Refresh
              </button>
              <button onClick={exportCsv} style={{ display: "flex", alignItems: "center", gap: 6, background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.slate, borderRadius: 8, padding: "7px 12px", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}>
                <IconDownload size={13} /> Export CSV
              </button>
            </div>
          </div>
          <ConnectionBanner connected={connected} />
          <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
            {[{ id: "all", label: "All Queues" }, ...QUEUES].map((q) => (
              <button key={q.id} onClick={() => setQueueFilter(q.id)} style={{
                padding: "8px 16px", borderRadius: 999, cursor: "pointer",
                background: queueFilter === q.id ? THEME.primary : THEME.panel,
                border: `1px solid ${queueFilter === q.id ? THEME.primary : THEME.border}`,
                color: queueFilter === q.id ? "#fff" : THEME.ink,
                fontFamily: "'Inter', sans-serif", fontSize: 12.5, fontWeight: 600
              }}>
                {q.label}
              </button>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "minmax(260px, 320px) 1fr", gap: 18 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <NowServingBoard tickets={queueFilteredTickets} />
              <Panel style={{ padding: 18 }}>
                <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, color: THEME.ink, marginBottom: 12 }}>
                  Call next student {queueFilter !== "all" && <span style={{ color: THEME.slate, fontWeight: 500 }}>· {queueInfo(queueFilter).label}</span>}
                </div>
                <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slate, marginBottom: 6 }}>Your name</div>
                <select value={windowChoice} onChange={(e) => setWindowChoice(e.target.value)}
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: windowChoice === ADVISOR_OTHER_VALUE ? 8 : 14 }}>
                  <option value="" disabled>Select your name…</option>
                  {ADVISORS.map((a) => <option key={a} value={a}>{a}</option>)}
                  <option value={ADVISOR_OTHER_VALUE}>Other — type name</option>
                </select>
                {windowChoice === ADVISOR_OTHER_VALUE && (
                  <input value={windowOther} onChange={(e) => setWindowOther(e.target.value)} placeholder="Your name"
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 14 }} />
                )}
                <button onClick={callNext} className="ssq-btn-primary" style={{ width: "100%", background: THEME.primary, color: "#fff", border: "none", borderRadius: 999, padding: "10px 0", fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                  Call next ({waiting.length} waiting)
                </button>
              </Panel>
              <Panel style={{ padding: 18 }}>
                <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, color: THEME.ink, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
                  <IconPlusCircle size={13} /> Add walk-in
                </div>
                <input value={walkName} onChange={(e) => setWalkName(e.target.value)} placeholder="Student name"
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 10 }} />
                <select value={walkService} onChange={(e) => setWalkService(e.target.value)}
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 10 }}>
                  {SERVICES.map((s) => <option key={s.code} value={s.code}>{s.label}</option>)}
                </select>
                <select value={walkStudentType} onChange={(e) => setWalkStudentType(e.target.value)}
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 10 }}>
                  <option value="New">New Student</option>
                  <option value="Returning">Returning Student</option>
                </select>
                {walkStudentType === "New" && (
                  <select value={walkProgramInquiry} onChange={(e) => setWalkProgramInquiry(e.target.value)}
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 10 }}>
                    <option value="">Program inquiry: not sure yet</option>
                    {PROGRAMS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                )}
                {walkStudentType === "Returning" && (
                  <select value={walkProgramEnrolled} onChange={(e) => setWalkProgramEnrolled(e.target.value)}
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 10 }}>
                    <option value="">Program enrolled…</option>
                    {PROGRAMS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                )}
                <select value={walkAdvisorChoice} onChange={(e) => setWalkAdvisorChoice(e.target.value)}
                  style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: walkAdvisorChoice === ADVISOR_OTHER_VALUE ? 8 : 12 }}>
                  <option value="">Workforce advisor: n/a</option>
                  {ADVISORS.map((a) => <option key={a} value={a}>{a}</option>)}
                  <option value={ADVISOR_OTHER_VALUE}>Other — type name</option>
                </select>
                {walkAdvisorChoice === ADVISOR_OTHER_VALUE && (
                  <input value={walkAdvisorOther} onChange={(e) => setWalkAdvisorOther(e.target.value)} placeholder="Advisor's name"
                    style={{ width: "100%", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "8px 10px", color: THEME.ink, fontFamily: "'Inter', sans-serif", fontSize: 13, marginBottom: 12 }} />
                )}
                <button onClick={addWalkIn} style={{ width: "100%", background: "none", color: THEME.ink, border: `1px solid ${THEME.border}`, borderRadius: 999, padding: "9px 0", fontFamily: "'Inter', sans-serif", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
                  Add to queue
                </button>
              </Panel>
              <button onClick={resetDay} style={{ background: "none", border: `1px solid ${THEME.border}`, color: THEME.red, borderRadius: 999, padding: "9px 0", fontFamily: "'Inter', sans-serif", fontSize: 12, cursor: "pointer" }}>
                Reset today's queue
              </button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <Panel style={{ padding: 18 }}>
                <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, color: THEME.ink, marginBottom: 4 }}>In progress ({inProgress.length})</div>
                {inProgress.length === 0 ? (
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: THEME.slateDim, padding: "10px 0" }}>Nobody's been called yet.</div>
                ) : (
                  <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                    {inProgress.map((t) => (
                      <div key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px" }}>
                        <div>
                          <Mono size={15}>{t.number}</Mono>
                          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate, marginLeft: 10 }}>{t.name}</span>
                          {t.studentType && <StudentTypeBadge type={t.studentType} />}
                          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim, marginLeft: 8 }}>{t.window}</span>
                          {(t.programInquiry || t.programEnrolled) && (
                            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim, marginLeft: 8 }}>· {t.programInquiry || t.programEnrolled}</span>
                          )}
                          {t.workforceAdvisor && (
                            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim, marginLeft: 8 }}>· Advisor: {t.workforceAdvisor}</span>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          {t.status === "called" && (
                            <button onClick={() => setStatus(t.id, "serving")} title="Mark serving" style={{ background: "none", border: `1px solid ${THEME.green}`, color: THEME.greenDark, borderRadius: 6, padding: "5px 8px", cursor: "pointer" }}>
                              <IconCheck size={13} />
                            </button>
                          )}
                          <button onClick={() => setStatus(t.id, "completed")} title="Complete" style={{ background: THEME.green, border: "none", color: "#fff", borderRadius: 6, padding: "5px 8px", cursor: "pointer" }}>
                            <IconCheck size={13} />
                          </button>
                          <button onClick={() => setStatus(t.id, "no-show")} title="No-show" style={{ background: "none", border: `1px solid ${THEME.red}`, color: THEME.red, borderRadius: 6, padding: "5px 8px", cursor: "pointer" }}>
                            <IconX size={13} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Panel>
              <Panel style={{ padding: 18 }}>
                <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 12, fontWeight: 700, color: THEME.ink, marginBottom: 4 }}>Waiting ({waiting.length})</div>
                {waiting.length === 0 ? (
                  <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: THEME.slateDim, padding: "10px 0" }}>Queue is empty.</div>
                ) : (
                  <div className="ssq-scrollbar" style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8, maxHeight: 380, overflowY: "auto" }}>
                    {waiting.map((t, i) => (
                      <div key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: THEME.bg, border: `1px solid ${THEME.border}`, borderRadius: 8, padding: "10px 12px" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim, width: 18 }}>{i + 1}</span>
                          <Mono size={15}>{t.number}</Mono>
                          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slate }}>{t.name}</span>
                          {t.studentType && <StudentTypeBadge type={t.studentType} />}
                          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim }}>{serviceInfo(t.service).label}</span>
                          {(t.programInquiry || t.programEnrolled) && (
                            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim }}>· {t.programInquiry || t.programEnrolled}</span>
                          )}
                          {t.workforceAdvisor && (
                            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim }}>· Advisor: {t.workforceAdvisor}</span>
                          )}
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ display: "flex", alignItems: "center", gap: 4, fontFamily: "'Inter', sans-serif", fontSize: 11, color: THEME.slateDim }}>
                            <IconClock size={11} /> {elapsedMin(t.checkinTime)}m
                          </span>
                          <button onClick={() => callStudent(t.id)} disabled={!windowNum.trim()} title={windowNum.trim() ? "Call this student" : "Enter your name first"} style={{
                            background: windowNum.trim() ? THEME.primary : THEME.border, border: "none", color: "#fff", borderRadius: 6,
                            padding: "5px 10px", cursor: windowNum.trim() ? "pointer" : "not-allowed",
                            fontFamily: "'Inter', sans-serif", fontSize: 11.5, fontWeight: 600
                          }}>
                            Call
                          </button>
                          <button onClick={() => setStatus(t.id, "cancelled")} title="Remove" style={{ background: "none", border: `1px solid ${THEME.border}`, color: THEME.slate, borderRadius: 6, padding: "5px 7px", cursor: "pointer" }}>
                            <IconSkipFwd size={13} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Panel>
            </div>
          </div>
        </div>
      </div>
      <PageFooter />
    </div>
  );
}

// ---------- Queue Display (for a waiting-room TV/monitor) ----------

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const iv = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(iv);
  }, []);
  return now;
}

function QueueDisplay({ onExit }) {
  const [tickets, setTickets] = useState([]);
  const [connected, setConnected] = useState(true);
  const now = useClock();

  const refresh = useCallback(async () => {
    const { data, connected } = await backend("getState");
    setTickets(data.tickets || []);
    setConnected(connected);
  }, []);

  useEffect(() => {
    refresh();
    const iv = setInterval(refresh, 3000);
    return () => clearInterval(iv);
  }, [refresh]);

  const active = tickets
    .filter((t) => t.status === "called" || t.status === "serving")
    .sort((a, b) => new Date(b.calledTime || b.checkinTime) - new Date(a.calledTime || a.checkinTime));

  const waitingCount = tickets.filter((t) => t.status === "waiting").length;

  return (
    <div style={{ minHeight: "100vh", background: THEME.bg, display: "flex", flexDirection: "column" }}>
      <GlobalStyle />
      <button onClick={onExit} title="Exit display mode" style={{
        position: "fixed", top: 14, right: 14, background: "rgba(0,0,0,0.06)", border: "none",
        borderRadius: 8, padding: "6px 8px", cursor: "pointer", opacity: 0.5, zIndex: 10
      }}>
        <IconX size={14} color={THEME.slate} />
      </button>

      <div style={{ background: THEME.panel, borderBottom: `1px solid ${THEME.border}` }}>
        <div style={{ padding: "22px 40px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <img src={LOGO_CCPS} alt="Collier County Public Schools — Workforce Education" style={{ height: 46 }} />
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 800, fontSize: 22, color: THEME.ink }}>Now Calling</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, color: THEME.slate }}>
              {now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}
            </div>
          </div>
        </div>
      </div>
      <div className="ssq-heat-bar" />

      <div style={{ flex: 1, padding: "40px 40px 20px" }}>
        {!connected && (
          <div style={{ maxWidth: 640, margin: "0 auto 24px", display: "flex", alignItems: "center", gap: 8, background: "#FDF1E7", border: `1px solid ${THEME.orange}`, borderRadius: 8, padding: "10px 14px" }}>
            <IconWifiOff size={14} color={THEME.orange} />
            <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#9A4A10" }}>Preview mode — not connected to your Microsoft List.</span>
          </div>
        )}

        {active.length === 0 ? (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "60vh", textAlign: "center" }}>
            <IconBell size={48} color={THEME.slateDim} />
            <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 28, color: THEME.slate, marginTop: 20 }}>
              Please have a seat
            </div>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 16, color: THEME.slateDim, marginTop: 8 }}>
              We'll call your number here when it's your turn.
            </div>
          </div>
        ) : (
          <div style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))",
            gap: 20, maxWidth: 1400, margin: "0 auto"
          }}>
            {active.map((t) => (
              <div key={t.id} style={{
                background: THEME.panel, border: `2px solid ${t.status === "serving" ? THEME.green : THEME.orange}`,
                borderRadius: 16, padding: "24px 28px", boxShadow: "0 2px 8px rgba(20,40,50,0.08)"
              }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                  <span style={{
                    fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1,
                    color: t.status === "serving" ? THEME.greenDark : THEME.orange,
                    display: "flex", alignItems: "center", gap: 6
                  }}>
                    <PulseDot color={t.status === "serving" ? THEME.green : THEME.orange} />
                    {t.status === "serving" ? "In progress" : "Please come forward"}
                  </span>
                  <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: THEME.slateDim }}>{serviceInfo(t.service).label}</span>
                </div>
                <div style={{ display: "flex", alignItems: "baseline", gap: 16 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 800, fontSize: 56, color: THEME.primaryDark, lineHeight: 1 }}>
                    {t.number}
                  </div>
                  <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 26, color: THEME.ink }}>
                    {(t.name || "").trim().split(" ")[0]}
                  </div>
                </div>
                <div style={{ fontFamily: "'Poppins', sans-serif", fontSize: 20, fontWeight: 600, color: THEME.ink, marginTop: 10 }}>
                  {t.window || "—"}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ textAlign: "center", padding: "16px 0 28px", fontFamily: "'Inter', sans-serif", fontSize: 13, color: THEME.slateDim }}>
        {waitingCount} {waitingCount === 1 ? "person" : "people"} waiting
      </div>
    </div>
  );
}

function getInitialView() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has("display") || params.get("view") === "display") return "display";
  } catch (e) { /* ignore */ }
  return "landing";
}

function App() {
  const [view, setView] = useState(getInitialView);
  const [staffAuthed, setStaffAuthed] = useState(false);

  const goLanding = () => {
    try { window.history.replaceState({}, "", window.location.pathname); } catch (e) { /* ignore */ }
    setView("landing");
  };

  if (view === "landing") return <Landing onPick={setView} />;
  if (view === "student") return <StudentView onBack={goLanding} />;
  if (view === "display") return <QueueDisplay onExit={goLanding} />;
  if (view === "staff") {
    if (!staffAuthed) return <StaffLogin onSuccess={() => setStaffAuthed(true)} onBack={goLanding} />;
    return <StaffConsole onExit={() => { setStaffAuthed(false); goLanding(); }} />;
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("ssq-root")).render(<App />);

</script>
</body>
</html>
